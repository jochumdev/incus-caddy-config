name: caddy-stack

# Single Caddy + incus-templated stack for incus-compose.
#
# Usage with trust token:
#   1. Mint a trust token for incus-templated:
#      echo "INCUS_TOKEN=$(incus config trust add --quiet incus-templated)" > .env
#   2. Start the stack:
#      incus-compose up -d
#
# Routing instances through this Caddy proxy:
#   Set labels on routed instances:
#     user.label.caddy: "app.example.com,upstream=8080" # optional flags: ,network=eth0

services:
  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    container_name: caddy
    restart: unless-stopped
    command: |
      sh -c 'if [ ! -f /config/Caddyfile ]; then echo -e "{\n\tadmin localhost:2019\n}\n:80 {\n\trespond \"Caddy initializing...\" 503\n}\n" > /config/Caddyfile; fi; exec caddy run --config /config/Caddyfile --adapter caddyfile'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - config:/config
      - data:/data
    networks:
      - default

  incus-templated:
    image: ghcr.io/jochumdev/incus-templated/incus-templated:1.0.0-beta.1
    build:
      context: .
      dockerfile: Containerfile
    container_name: incus-templated
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      INCUS_TEMPLATED_INCUS: "${INCUS_TEMPLATED_INCUS:?Incus HTTPS API endpoint is required, e.g. https://10.0.0.1:8443}"
      INCUS_TEMPLATED_TARGETS: "${CADDY_LABEL:-caddy},preset=caddy,instance=caddy,project=${INCUS_PROJECT:-default}"
      INCUS_TEMPLATED_DATA_DIR: /var/lib/incus-templated
      INCUS_TEMPLATED_SECRETS_DIR: /run/secrets
      INCUS_TEMPLATED_HTTP_ADDRESS: :9153
      INCUS_TEMPLATED_LOG: "${INCUS_TEMPLATED_LOG:-INFO}"
    secrets:
      - token
    volumes:
      - incus-templated:/var/lib/incus-templated
    networks:
      - default

secrets:
  token:
    environment: INCUS_TOKEN

volumes:
  config:
  data:
  incus-templated:

networks:
  default:
