name: caddy-stack

# Single Caddy + caddy-config stack for incus-compose.
#
# Usage with trust token:
#   1. Mint a trust token for caddy-config:
#      echo "INCUS_TOKEN=$(incus config trust add --quiet caddy-config)" > .env
#   2. Start the stack:
#      incus-compose up -d
#
# Routing instances through this Caddy proxy:
#   Set labels on routed instances:
#     user.label.caddy.domain: "app.example.com"
#     user.label.caddy.upstream: "8080"
#     user.label.caddy.network: "eth0" # optional: interface for IPv4

services:
  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    container_name: caddy
    restart: unless-stopped
    command: |
      sh -c 'if [ ! -f /config/Caddyfile ]; then echo -e "{\n\tadmin localhost:2019\n}\n:80 {\n\trespond \"Caddy initializing...\" 503\n}\n" > /config/Caddyfile; fi; exec caddy run --config /config/Caddyfile --adapter caddyfile'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - config:/config
      - data:/data
    networks:
      - default

  caddy-config:
    image: ghcr.io/jochumdev/incus-caddy-config/caddy-config:1.0.0-beta.1
    build:
      context: .
      dockerfile: Containerfile
    container_name: caddy-config
    restart: unless-stopped
    depends_on:
      caddy:
        condition: service_healthy
    environment:
      INCUS_CADDY_INCUS: "${INCUS_CADDY_INCUS:?Incus HTTPS API endpoint is required, e.g. https://10.0.0.1:8443}"
      INCUS_CADDY_INSTANCES: "${CADDY_LABEL:-caddy},instance=caddy,project=${INCUS_PROJECT:-default}"
      INCUS_CADDY_CADDYFILE_PATH: /config/Caddyfile
      INCUS_CADDY_DATA_DIR: /var/lib/caddy-config
      INCUS_CADDY_SECRETS_DIR: /run/secrets
      INCUS_CADDY_HTTP_ADDRESS: :9153
      INCUS_CADDY_LOG: "${INCUS_CADDY_LOG:-INFO}"
    secrets:
      - token
    volumes:
      - caddy-config:/var/lib/caddy-config
    networks:
      - default

secrets:
  token:
    environment: INCUS_TOKEN

volumes:
  config:
  data:
  caddy-config:

networks:
  default:
